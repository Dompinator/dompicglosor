<!DOCTYPE html>
<html lang="sv" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DompicGlosor</title>
  <style>
    html[data-theme="bright"] {
      --bg: #b7dcff;
      --bg2: #dff0ff;
      --ink: #3aa0e8;
      --muted: #4ea6d8;
      --card: #ffffff;
      --line: rgba(255,255,255,.8);
      --btn: #ffffff;
      --btn-text: #4db3ff;
      --shadow: 0 16px 40px rgba(70,150,210,.18);
    }
    html[data-theme="dark"] {
      --bg: #5a2d86;
      --bg2: #3b1760;
      --ink: #c9a6ff;
      --muted: #b48fff;
      --card: #110817;
      --line: rgba(0,0,0,.4);
      --btn: #000000;
      --btn-text: #c084fc;
      --shadow: 0 18px 44px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% -10%, var(--bg2), transparent 42%),
        radial-gradient(circle at 100% 110%, var(--bg2), transparent 36%),
        var(--bg);
      transition: background .55s cubic-bezier(.22,1,.36,1), color .45s ease;
    }
    button, input, .card, .big-btn, .theme-toggle {
      transition: background .45s cubic-bezier(.22,1,.36,1), color .45s ease, transform .35s cubic-bezier(.22,1,.36,1), box-shadow .45s ease, opacity .35s ease;
    }
    .theme-toggle {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 50;
      border: 0;
      background: var(--btn);
      color: var(--btn-text);
      font-weight: 800;
      font-size: .82rem;
      cursor: pointer;
      padding: 10px 14px;
      border-radius: 999px;
      box-shadow: var(--shadow);
    }
    .theme-toggle:hover { transform: translateY(-2px); }
    .wrap { width: min(780px, 92vw); margin: 0 auto; padding: 78px 0 56px; }
    .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
    .logo {
      width: 64px; height: 64px; border-radius: 18px; flex: 0 0 64px;
      background: #07041a;
      box-shadow: 0 0 24px rgba(110,80,255,.35);
    }
    .wordmark { font-size: clamp(1.7rem,5vw,2.4rem); font-weight: 900; letter-spacing: -.03em; line-height: 1; }
    .wordmark span { opacity: .72; font-weight: 700; }
    h1 { font-size: clamp(1.7rem,5vw,2.5rem); line-height: 1.1; font-weight: 800; }
    .lead { color: var(--muted); margin-top: 8px; font-size: 1.02rem; }
    .screen { display: none; }
    .screen.show { display: block; animation: fadeUp .55s cubic-bezier(.22,1,.36,1); }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }
    .home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 26px; }
    .big-btn, .card, button.act, button.ghost, button.pick {
      background: var(--btn); color: var(--btn-text); border: 1px solid var(--line); box-shadow: var(--shadow);
    }
    .big-btn { border-radius: 24px; padding: 28px 20px; text-align: left; cursor: pointer; min-height: 180px; }
    .big-btn:hover, button.act:hover, button.ghost:hover, button.pick:hover { transform: translateY(-3px); }
    .big-btn h2 { font-size: 1.7rem; margin-bottom: 8px; color: var(--btn-text); }
    .big-btn p { color: var(--btn-text); opacity: .78; }
    .card { background: var(--card); border-radius: 22px; padding: 22px; }
    .back { border: 0; background: transparent; color: var(--ink); font-weight: 800; cursor: pointer; margin-bottom: 12px; }
    label { display: block; font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    input {
      width: 100%; margin-bottom: 14px; padding: 12px 14px; border-radius: 14px;
      border: 1px solid var(--line); background: var(--btn); color: var(--btn-text); font-size: 1.05rem; font-family: inherit;
    }
    .row-btns, .stack { display: flex; gap: 10px; }
    .stack { flex-direction: column; }
    button.act, button.ghost, button.pick {
      border-radius: 14px; padding: 12px 14px; cursor: pointer; font-weight: 800; font-size: 1rem;
    }
    button.act, button.ghost { flex: 1; }
    button.pick { width: 100%; text-align: left; padding: 16px; margin-bottom: 10px; }
    .pack-title { font-size: 1.15rem; display: block; color: var(--btn-text); }
    .pack-meta { opacity: .75; font-size: .92rem; margin-top: 4px; display: block; color: var(--btn-text); }
    .count, .tiny { margin-top: 12px; color: var(--muted); font-size: .92rem; }
    .ask { font-size: clamp(1.8rem,6vw,2.6rem); text-align: center; margin: 8px 0 16px; word-break: break-word; animation: fadeUp .45s cubic-bezier(.22,1,.36,1); }
    button.act:disabled, button.ghost:disabled { opacity: .4; cursor: default; transform: none; }
    .feedback { min-height: 1.4em; text-align: center; font-weight: 800; margin: 4px 0 10px; }
    .feedback.ok { color: #2bd48a; }
    .feedback.bad { color: #ff7b7b; }
    .online-btn {
      width: 100%;
      margin-top: 12px;
      min-height: 64px;
      border-radius: 16px;
      padding: 14px 18px;
      text-align: left;
      cursor: pointer;
      font-weight: 800;
    }
    .online-btn h2 { font-size: 1.2rem; margin-bottom: 2px; color: var(--btn-text); }
    .online-btn p { color: var(--btn-text); opacity: .75; font-size: .92rem; font-weight: 600; }
    .tabs { display: flex; gap: 8px; margin: 12px 0 14px; }
    .tabs button {
      flex: 1; border-radius: 12px; padding: 10px; cursor: pointer; font-weight: 800;
      background: var(--btn); color: var(--btn-text); border: 1px solid var(--line);
    }
    .tabs button.on { outline: 2px solid var(--ink); }
    .pack-row { display: flex; gap: 8px; align-items: stretch; margin-bottom: 10px; }
    .pack-row .pick { margin: 0; flex: 1; }
    .menu-wrap { position: relative; }
    .dots {
      width: 44px; height: auto; border-radius: 12px; cursor: pointer; font-weight: 900;
      background: var(--btn); color: var(--btn-text); border: 1px solid var(--line);
    }
    .menu {
      display: none; position: absolute; right: 0; top: 46px; min-width: 150px; z-index: 8;
      background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
      box-shadow: var(--shadow);
    }
    .menu.open { display: block; }
    .menu button {
      width: 100%; text-align: left; border: 0; background: transparent; color: var(--ink);
      padding: 10px 12px; cursor: pointer; font-weight: 700;
    }
    .modal-bg {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 80;
      align-items: center; justify-content: center; padding: 18px;
    }
    .modal-bg.open { display: flex; }
    .modal {
      width: min(420px, 100%); background: var(--card); color: var(--ink);
      border-radius: 18px; padding: 18px; box-shadow: var(--shadow);
    }
    .save-hidden { display: none; }
    @media (max-width: 640px) {
      .home-grid { grid-template-columns: 1fr; }
      .logo { width: 54px; height: 54px; flex-basis: 54px; }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" type="button">Bright mode</button>
  <audio id="correctSound" src="correct.mp3" preload="auto"></audio>
  <audio id="wrongSound" src="wrong.mp3" preload="auto"></audio>
  <div class="wrap">
    <div class="brand">
      <img class="logo" src="DompicGlosor-logga.png" alt="DompicGlosor-logga" />
      <div class="wordmark">Dompic<span>Glosor</span></div>
    </div>
    <h1 id="pageTitle">Välj läge</h1>
    <p class="lead" id="pageLead">Custom för egna glosor. Premade för färdiga paket.</p>

    <section class="screen show" id="homeScreen">
      <div class="home-grid">
        <button class="big-btn" id="goCustom" type="button">
          <h2>Custom</h2>
          <p>Skriv in egna glosor. Ett par i taget, sen övar du.</p>
        </button>
        <button class="big-btn" id="goPremade" type="button">
          <h2>Premade</h2>
          <p>Välj ett färdigt glospaket och börja direkt.</p>
        </button>
      </div>
      <button class="online-btn" id="goOnline" type="button">
        <h2>Online</h2>
        <p>Privata och publicerade glosor.</p>
      </button>
    </section>

    <section class="screen" id="premadeScreen">
      <button class="back" id="backFromPremade" type="button">← Startsida</button>
      <div class="card" id="packList"></div>
    </section>


    <section class="screen" id="onlineScreen">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px">
        <button class="back" id="backFromOnline" type="button" style="margin:0">← Startsida</button>
        <button class="ghost" id="adminLoginBtn" type="button" style="flex:0 0 auto;padding:8px 12px">Logga in</button>
      </div>
      <div class="tabs">
        <button type="button" id="tabPublic" class="on">Public</button>
        <button type="button" id="tabPrivate">Private</button>
      </div>
      <div class="card" id="onlineList"></div>
    </section>
    <section class="screen" id="enterScreen">
      <button class="back" id="backFromEnter" type="button">← Startsida</button>
      <div class="card">
        <label for="langInput">språk</label>
        <input id="langInput" autocomplete="off" />
        <label for="svInput">svenska</label>
        <input id="svInput" autocomplete="off" />
        <div class="row-btns">
          <button class="ghost" id="klarBtn" type="button">Klar</button>
          <button class="act" id="nastaBtn" type="button">Nästa</button>
        </div>
        <p class="count" id="wordCount">0 glosor inskrivna</p>
      </div>
    </section>

    <section class="screen" id="choiceScreen">
      <button class="back" id="backFromChoice" type="button">← Tillbaka</button>
      <div class="card">
        <p class="tiny" id="choiceSub">Välj riktning</p>
        <div class="stack" style="margin-top:14px">
          <button class="act" id="svToLang" type="button">Svenska → språket</button>
          <button class="ghost" id="langToSv" type="button">Språket → svenska</button>
        </div>
      </div>
    </section>

    <section class="screen" id="quizScreen">
      <button class="back" id="backFromQuiz" type="button">← Avsluta</button>
      <div class="card">
        <p class="tiny" id="quizHint">Översätt</p>
        <p class="ask" id="askWord">—</p>
        <label for="answerInput">Din översättning</label>
        <input id="answerInput" autocomplete="off" />
        <p class="feedback" id="feedback"></p>
        <button class="act" id="checkBtn" type="button">Kolla</button>
        <p class="count" id="quizScore">Poäng: 0 / 0</p>
      </div>
    </section>

    <section class="screen" id="doneScreen">
      <div class="card">
        <h2 style="margin-bottom:8px">Klar!</h2>
        <p class="lead" id="doneText">Bra jobbat.</p>
        <div class="stack" style="margin-top:18px">
          <button class="act" id="againBtn" type="button">Köra om</button>
          <button class="ghost" id="fixBtn" type="button">Fixa misstag</button>
          <button class="ghost save-hidden" id="saveBtn" type="button">Spara glosor</button>
          <button class="ghost" id="homeBtn" type="button">Startsida</button>
        </div>
      </div>
    </section>
  </div>

  <div class="modal-bg" id="saveModal">
    <div class="modal">
      <h2 style="margin-bottom:10px">Spara till Private</h2>
      <label for="saveName">Namn</label>
      <input id="saveName" autocomplete="off" />
      <div class="row-btns">
        <button class="ghost" id="saveCancel" type="button">Avbryt</button>
        <button class="act" id="saveConfirm" type="button">Spara</button>
      </div>
      <p class="count" id="saveErr"></p>
    </div>
  </div>
  <div class="modal-bg" id="pubModal">
    <div class="modal">
      <h2 style="margin-bottom:10px">Publicera</h2>
      <p class="tiny" id="pubInfo">Ge listan ett namn.</p>
      <label for="pubName">Namn på glosorna</label>
      <input id="pubName" autocomplete="off" />
      <label for="pubSub">Undertext</label>
      <input id="pubSub" autocomplete="off" />
      <label for="pubAuthor">Ditt namn som publicerare</label>
      <input id="pubAuthor" autocomplete="off" />
      <div class="row-btns">
        <button class="ghost" id="pubCancel" type="button">Avbryt</button>
        <button class="act" id="pubConfirm" type="button">Publicera</button>
      </div>
      <p class="count" id="pubErr"></p>
    </div>
  </div>
  <div class="modal-bg" id="loginModal">
    <div class="modal">
      <h2 id="authTitle" style="margin-bottom:10px">Logga in</h2>
      <div class="tabs" style="margin-top:0">
        <button type="button" id="modeLogin" class="on">Logga in</button>
        <button type="button" id="modeSignup">Skapa konto</button>
      </div>
      <label for="adminUser">Användarnamn</label>
      <input id="adminUser" autocomplete="off" />
      <label for="adminPass">Lösenord</label>
      <input id="adminPass" type="password" autocomplete="off" />
      <div class="row-btns">
        <button class="ghost" id="loginCancel" type="button">Avbryt</button>
        <button class="act" id="loginConfirm" type="button">Logga in</button>
      </div>
      <p class="count" id="loginErr"></p>
    </div>
  </div>
  <script>
    const PACKS = [{
      id: "sophie-schultag",
      title: "Sophies Schultag",
      meta: "TY7 Genau Neu 7 · Kapitel 2 · 24 glosor",
      words: [
        ["die Freundin", "väninnan"],
        ["der Unterricht", "undervisningen"],
        ["hart", "hård / hårt / tufft / tuff"],
        ["die Stunde", "timmen / lektionen"],
        ["die Stunden", "timmar / lektioner"],
        ["die AG", "individuellt val"],
        ["die Theater-AG", "teater som individuellt val"],
        ["der Sketch", "sketchen"],
        ["die Sketche", "sketcher"],
        ["die Mittagspause", "lunchrasten"],
        ["Spaß machen", "vara kul / vara roligt"],
        ["die Cafeteria", "cafeterian"],
        ["bis", "tills"],
        ["die Klavierstunde", "pianolektionen"],
        ["die Hausaufgabe", "läxan"],
        ["die Hausaufgaben", "läxor"],
        ["lernen", "lära sig / plugga"],
        ["am schönsten", "bäst / skönast"],
        ["verliebt", "förälskad / kär"],
        ["Stimmt nicht!", "Det stämmer inte!"],
        ["übrigens", "förresten / för övrigt"],
        ["planen", "planera"],
        ["die Klassenfahrt", "klassresan"],
        ["im nächsten Frühling", "nästa vår"]
      ]
    }];
    let words = [], returnTo = "home", quizDir = "sv-lang", queue = [], current = null, correctCount = 0, totalAsked = 0, revealed = false, mistakes = [];
    const screens = ["homeScreen","premadeScreen","enterScreen","choiceScreen","quizScreen","doneScreen","onlineScreen"];
    const GITHUB_REPO = ""; // t.ex. "dittnamn/dompicglosor"
    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem("dompic-theme", theme);
      document.getElementById("themeToggle").textContent = theme === "dark" ? "Bright mode" : "Dark mode";
    }
    applyTheme(localStorage.getItem("dompic-theme") === "bright" ? "bright" : "dark");
    document.getElementById("themeToggle").addEventListener("click", function () {
      applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "bright" : "dark");
    });
    function showScreen(id, title, lead) {
      screens.forEach(function (name) { document.getElementById(name).classList.toggle("show", name === id); });
      if (title) document.getElementById("pageTitle").textContent = title;
      if (lead) document.getElementById("pageLead").textContent = lead;
    }
    function beep(freqs, vol) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        let t = ctx.currentTime;
        freqs.forEach(function (f, i) {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = "sine";
          o.frequency.value = f;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
          o.connect(g); g.connect(ctx.destination);
          o.start(t); o.stop(t + 0.18);
          t += 0.11;
        });
      } catch (e) {}
      const el = document.getElementById(freqs[0] > 400 ? "correctSound" : "wrongSound");
      if (el && el.src && !el.src.endsWith("/")) el.play().catch(function(){});
    }
    function playSound(id) {
      if (id === "correctSound") beep([659, 880], 0.08);
      else beep([311, 196], 0.07);
    }
    document.getElementById("goCustom").addEventListener("click", function () {
      words = []; returnTo = "enter";
      document.getElementById("langInput").value = "";
      document.getElementById("svInput").value = "";
      updateCount();
      showScreen("enterScreen", "Custom", "Skriv in glosor. Nästa för fler, Klar när du är färdig.");
      document.getElementById("langInput").focus();
    });
    document.getElementById("goPremade").addEventListener("click", function () {
      const box = document.getElementById("packList"); box.innerHTML = "";
      PACKS.forEach(function (pack) {
        const btn = document.createElement("button");
        btn.type = "button"; btn.className = "pick";
        btn.innerHTML = "<span class='pack-title'></span><span class='pack-meta'></span>";
        btn.querySelector(".pack-title").textContent = pack.title;
        btn.querySelector(".pack-meta").textContent = pack.meta;
        btn.addEventListener("click", function () {
          words = pack.words.map(function (pair) { return { lang: pair[0], sv: pair[1] }; });
          returnTo = "premade";
          document.getElementById("choiceSub").textContent = pack.title + " · " + words.length + " glosor";
          showScreen("choiceScreen", pack.title, "Välj om du ska översätta från svenska eller till svenska.");
        });
        box.appendChild(btn);
      });
      showScreen("premadeScreen", "Premade", "Välj vilka glosor du vill träna på.");
    });
    function goHome() { showScreen("homeScreen", "Välj läge", "Custom för egna glosor. Premade för färdiga paket."); }
    document.getElementById("backFromPremade").addEventListener("click", goHome);
    document.getElementById("backFromEnter").addEventListener("click", goHome);
    document.getElementById("backFromChoice").addEventListener("click", function () {
      if (returnTo === "enter") showScreen("enterScreen", "Custom", "Skriv in glosor. Nästa för fler, Klar när du är färdig.");
      else if (returnTo === "premade") document.getElementById("goPremade").click();
      else if (returnTo === "online") document.getElementById("goOnline").click();
      else goHome();
    });
    document.getElementById("backFromQuiz").addEventListener("click", function () { showScreen("choiceScreen", "Öva", "Välj riktning."); });
    function saveCurrentPair() {
      const lang = document.getElementById("langInput").value.trim();
      const sv = document.getElementById("svInput").value.trim();
      if (!lang || !sv) return false;
      words.push({ lang: lang, sv: sv });
      document.getElementById("langInput").value = "";
      document.getElementById("svInput").value = "";
      updateCount();
      return true;
    }
    function updateCount() {
      const n = words.length;
      document.getElementById("wordCount").textContent = n + (n === 1 ? " glosa inskriven" : " glosor inskrivna");
    }
    document.getElementById("nastaBtn").addEventListener("click", function () { if (saveCurrentPair()) document.getElementById("langInput").focus(); });
    document.getElementById("langInput").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); document.getElementById("svInput").focus(); } });
    document.getElementById("svInput").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); if (saveCurrentPair()) document.getElementById("langInput").focus(); } });
    document.getElementById("klarBtn").addEventListener("click", function () {
      saveCurrentPair();
      if (!words.length) { document.getElementById("wordCount").textContent = "Skriv minst en glosa först."; return; }
      document.getElementById("choiceSub").textContent = words.length + " egna glosor redo.";
      showScreen("choiceScreen", "Custom", "Välj om du ska översätta från svenska eller till svenska.");
    });
    document.getElementById("svToLang").addEventListener("click", function () { startQuiz("sv-lang"); });
    document.getElementById("langToSv").addEventListener("click", function () { startQuiz("lang-sv"); });
    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i -= 1) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
      return a;
    }
    function startQuiz(dir, list) {
      quizDir = dir;
      queue = shuffle(list || words);
      correctCount = 0;
      totalAsked = 0;
      revealed = false;
      if (list !== mistakes) mistakes = [];
      showScreen("quizScreen", "Öva", "Skriv översättningen och tryck Kolla.");
      nextQuestion();
    }
    function nextQuestion() {
      if (!queue.length) {
        const n = mistakes.length;
        document.getElementById("doneText").textContent = "Poäng: " + correctCount + " av " + totalAsked + " rätt." + (n ? " " + n + " att fixa." : " Inga misstag!");
        document.getElementById("fixBtn").disabled = n === 0;
        document.getElementById("saveBtn").classList.toggle("save-hidden", returnTo !== "enter");
        showScreen("doneScreen", "Klar!", "Vad vill du göra nu?");
        return;
      }
      current = queue.shift(); revealed = false;
      const ask = document.getElementById("askWord");
      ask.style.animation = "none";
      void ask.offsetWidth;
      ask.style.animation = "fadeUp .45s cubic-bezier(.22,1,.36,1)";
      const fromSv = quizDir === "sv-lang";
      ask.textContent = fromSv ? current.sv : current.lang;
      document.getElementById("quizHint").textContent = fromSv ? "Översätt till språket" : "Översätt till svenska";
      document.getElementById("answerInput").value = "";
      document.getElementById("feedback").textContent = "";
      document.getElementById("feedback").className = "feedback";
      document.getElementById("checkBtn").textContent = "Kolla";
      document.getElementById("quizScore").textContent = "Poäng: " + correctCount + " / " + totalAsked + " · " + queue.length + " kvar";
      document.getElementById("answerInput").focus();
    }
    function normalize(text) {
      return String(text)
        .toLowerCase()
        .replace(/[.,!?]/g, " ")
        .replace(/\b(der|die|das|ein|eine|ett|en)\b/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }
    function alternatives(text) {
      return String(text).split(/\s*(?:\/|;|,|\||\beller\b)\s*/i).map(normalize).filter(Boolean);
    }
    function isCorrect(answer, expected) {
      const got = normalize(answer);
      if (!got) return false;
      const opts = alternatives(expected);
      if (opts.indexOf(got) !== -1) return true;
      if (normalize(expected) === got) return true;
      return opts.some(function (opt) {
        return opt === got || opt.replace(/t$/, "") === got.replace(/t$/, "");
      });
    }
    function checkAnswer() {
      if (!current) return;
      if (revealed) { nextQuestion(); return; }
      const expected = quizDir === "sv-lang" ? current.lang : current.sv;
      totalAsked += 1;
      const ok = isCorrect(document.getElementById("answerInput").value, expected);
      const box = document.getElementById("feedback");
      if (ok) { correctCount += 1; box.textContent = "Rätt!"; box.className = "feedback ok"; playSound("correctSound"); }
      else {
        box.textContent = "Rätt svar: " + expected;
        box.className = "feedback bad";
        playSound("wrongSound");
        if (!mistakes.some(function (w) { return w.lang === current.lang && w.sv === current.sv; })) mistakes.push(current);
      }
      revealed = true;
      document.getElementById("checkBtn").textContent = queue.length ? "Nästa" : "Klar";
      document.getElementById("quizScore").textContent = "Poäng: " + correctCount + " / " + totalAsked + " · " + queue.length + " kvar";
    }
    document.getElementById("checkBtn").addEventListener("click", checkAnswer);
    document.getElementById("answerInput").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); checkAnswer(); } });
    document.getElementById("againBtn").addEventListener("click", function () { startQuiz(quizDir, words); });
    document.getElementById("fixBtn").addEventListener("click", function () {
      if (!mistakes.length) return;
      startQuiz(quizDir, mistakes.slice());
    });
    document.getElementById("homeBtn").addEventListener("click", goHome);

    var onlineTab = "public";
    var publishTarget = null;
    function loadStore(key) {
      try { return JSON.parse(localStorage.getItem(key) || "[]"); } catch (e) { return []; }
    }
    function saveStore(key, val) { localStorage.setItem(key, JSON.stringify(val)); }
    function bannedWords() {
      return ["fan","helvete","skit","jävla","javla","jävel","javel","fuck","shit","bitch","asshole","cunt","nigger","nigga","retard","hora","fitta","kuk","balle","knull","knulla","wank","dick","pussy"];
    }
    function hasSwears(list) {
      const raw = JSON.stringify(list).toLowerCase().replace(/[^a-zåäöé]/g, " ");
      return bannedWords().some(function (w) { return raw.indexOf(w) !== -1; });
    }
    function parseIssueList(issue) {
      const title = String(issue.title || "");
      if (title.indexOf("[DompicGlosor]") === -1 && title.indexOf("Publicera:") === -1) return null;
      const body = String(issue.body || "");
      const start = body.indexOf("{");
      const end = body.lastIndexOf("}");
      if (start < 0 || end <= start) return null;
      try {
        const data = JSON.parse(body.slice(start, end + 1));
        if (!data.words) return null;
        data.id = data.id || ("issue-" + issue.number);
        return data;
      } catch (e) { return null; }
    }
    function renderOnline() {
      const box = document.getElementById("onlineList");
      box.innerHTML = "";
      document.getElementById("tabPublic").classList.toggle("on", onlineTab === "public");
      document.getElementById("tabPrivate").classList.toggle("on", onlineTab === "private");
      if (onlineTab === "private") {
        if (!currentUser()) {
          box.innerHTML = "<p class='tiny'>Logga in eller skapa konto för att se dina sparade glosor.</p>";
          return;
        }
        const items = getUserLists();
        if (!items.length) { box.innerHTML = "<p class='tiny'>Inget sparat på det här kontot än. Kör Custom och tryck Spara glosor.</p>"; return; }
        items.forEach(function (item) { box.appendChild(rowFor(item, true)); });
      } else {
        const localPub = loadStore("dompic-public-v1");
        box.innerHTML = "<p class='tiny'>Hämtar publicerade listor...</p>";
        const jobs = [fetch("public-lists.json", { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : []; }).catch(function () { return []; })];
        if (GITHUB_REPO) {
          jobs.push(fetch("https://api.github.com/repos/" + GITHUB_REPO + "/issues?state=open&per_page=50").then(function (r) { return r.ok ? r.json() : []; }).then(function (issues) {
            if (!Array.isArray(issues)) return [];
            return issues.map(parseIssueList).filter(function (x) { return x && x.words && x.words.length && !hasSwears(x); });
          }).catch(function () { return []; }));
        } else {
          jobs.push(Promise.resolve([]));
        }
        Promise.all(jobs).then(function (parts) {
          const all = [].concat(parts[0] || [], parts[1] || [], localPub);
          const seen = {}; const unique = [];
          all.forEach(function (it) {
            if (!it) return;
            const k = (it.id || "") + "|" + (it.name || "");
            if (seen[k]) return; seen[k] = true; unique.push(it);
          });
          box.innerHTML = "";
          if (!unique.length) {
            box.innerHTML = GITHUB_REPO
              ? "<p class='tiny'>Inga publicerade listor än. Publish skickar en GitHub-issue. Tryck Submit där så syns listan här.</p>"
              : "<p class='tiny'>Sätt GITHUB_REPO i index.html till dittnamn/reponamn så kan andra publicera.</p>";
            return;
          }
          unique.forEach(function (item) { box.appendChild(rowFor(item, false)); });
        });
      }
    }
    function rowFor(item, isPrivate) {
      const wrap = document.createElement("div");
      wrap.className = "pack-row";
      const btn = document.createElement("button");
      btn.type = "button"; btn.className = "pick";
      btn.innerHTML = "<span class='pack-title'></span><span class='pack-meta'></span>";
      btn.querySelector(".pack-title").textContent = item.name || "Utan namn";
      btn.querySelector(".pack-meta").textContent = (item.subtitle || "") + (item.author ? " · " + item.author : "") + " · " + (item.words || []).length + " glosor";
      btn.addEventListener("click", function () {
        words = (item.words || []).map(function (w) { return { lang: w.lang, sv: w.sv }; });
        returnTo = "online";
        document.getElementById("choiceSub").textContent = (item.name || "Lista") + " · " + words.length + " glosor";
        showScreen("choiceScreen", item.name || "Online", "Välj riktning.");
      });
      wrap.appendChild(btn);
      if (isPrivate) {
        const menuWrap = document.createElement("div");
        menuWrap.className = "menu-wrap";
        const dots = document.createElement("button");
        dots.type = "button"; dots.className = "dots"; dots.textContent = "⋮";
        const menu = document.createElement("div");
        menu.className = "menu";
        const pub = document.createElement("button");
        pub.type = "button"; pub.textContent = "Publish";
        pub.addEventListener("click", function () { menu.classList.remove("open"); startPublish(item); });
        const del = document.createElement("button");
        del.type = "button"; del.textContent = "Ta bort";
        del.addEventListener("click", function () {
          setUserLists(getUserLists().filter(function (x) { return x.id !== item.id; }));
          renderOnline();
        });
        menu.appendChild(pub); menu.appendChild(del);
        dots.addEventListener("click", function (e) {
          e.stopPropagation();
          document.querySelectorAll(".menu.open").forEach(function (m) { m.classList.remove("open"); });
          menu.classList.toggle("open");
        });
        menuWrap.appendChild(dots); menuWrap.appendChild(menu); wrap.appendChild(menuWrap);
      }
      return wrap;
    }
    function isAdmin() { return sessionStorage.getItem("dompic-admin") === "1"; }
    function currentUser() { return sessionStorage.getItem("dompic-user") || ""; }
    function loadAccounts() {
      try { return JSON.parse(localStorage.getItem("dompic-accounts-v1") || "{}"); } catch (e) { return {}; }
    }
    function saveAccounts(obj) { localStorage.setItem("dompic-accounts-v1", JSON.stringify(obj)); }
    function getUserLists() {
      const acc = loadAccounts()[currentUser()];
      return (acc && acc.lists) ? acc.lists : [];
    }
    function setUserLists(lists) {
      const name = currentUser();
      if (!name) return;
      const all = loadAccounts();
      if (!all[name]) all[name] = { password: "", lists: [] };
      all[name].lists = lists;
      saveAccounts(all);
    }
    function startPublish(item) {
      publishTarget = item;
      document.getElementById("pubName").value = item.name || "";
      document.getElementById("pubSub").value = item.subtitle || "";
      document.getElementById("pubAuthor").value = item.author || currentUser();
      document.getElementById("pubErr").textContent = "";
      document.getElementById("pubInfo").textContent = "Listan granskas innan den syns för alla.";
      document.getElementById("pubModal").classList.add("open");
    }
    function refreshAdminBtn() {
      const b = document.getElementById("adminLoginBtn");
      b.textContent = currentUser() ? ("Logga ut (" + currentUser() + ")") : "Logga in";
    }
    var authMode = "login";
    function setAuthMode(mode) {
      authMode = mode;
      document.getElementById("modeLogin").classList.toggle("on", mode === "login");
      document.getElementById("modeSignup").classList.toggle("on", mode === "signup");
      document.getElementById("authTitle").textContent = mode === "login" ? "Logga in" : "Skapa konto";
      document.getElementById("loginConfirm").textContent = mode === "login" ? "Logga in" : "Skapa konto";
      document.getElementById("loginErr").textContent = "";
    }
    function finishLogin(name, admin) {
      sessionStorage.setItem("dompic-user", name);
      if (admin) sessionStorage.setItem("dompic-admin", "1");
      else sessionStorage.removeItem("dompic-admin");
      document.getElementById("loginModal").classList.remove("open");
      refreshAdminBtn();
      onlineTab = "private";
      renderOnline();
    }
    document.getElementById("goOnline").addEventListener("click", function () {
      onlineTab = "public";
      refreshAdminBtn();
      showScreen("onlineScreen", "Online", "Public är godkända listor. Private är ditt konto.");
      renderOnline();
    });
    document.getElementById("adminLoginBtn").addEventListener("click", function () {
      if (currentUser()) {
        sessionStorage.removeItem("dompic-admin");
        sessionStorage.removeItem("dompic-user");
        refreshAdminBtn();
        renderOnline();
        return;
      }
      document.getElementById("adminUser").value = "";
      document.getElementById("adminPass").value = "";
      setAuthMode("login");
      document.getElementById("loginModal").classList.add("open");
    });
    document.getElementById("modeLogin").addEventListener("click", function () { setAuthMode("login"); });
    document.getElementById("modeSignup").addEventListener("click", function () { setAuthMode("signup"); });
    document.getElementById("loginCancel").addEventListener("click", function () {
      document.getElementById("loginModal").classList.remove("open");
    });
    document.getElementById("loginConfirm").addEventListener("click", function () {
      const u = document.getElementById("adminUser").value.trim();
      const pw = document.getElementById("adminPass").value.trim();
      if (!u || !pw) { document.getElementById("loginErr").textContent = "Fyll i båda fälten."; return; }
      const all = loadAccounts();
      if (authMode === "signup") {
        if (u.toLowerCase() === "dompinator") { document.getElementById("loginErr").textContent = "Det namnet är upptaget."; return; }
        if (all[u]) { document.getElementById("loginErr").textContent = "Kontot finns redan. Logga in istället."; return; }
        const old = loadStore("dompic-private-v1");
        all[u] = { password: pw, lists: old.slice() };
        saveAccounts(all);
        finishLogin(u, false);
        return;
      }
      if (u === "Dompinator" && pw === "1379") {
        if (!all[u]) { all[u] = { password: pw, lists: loadStore("dompic-private-v1") }; saveAccounts(all); }
        finishLogin(u, true);
        return;
      }
      if (all[u] && all[u].password === pw) {
        finishLogin(u, false);
      } else {
        document.getElementById("loginErr").textContent = "Fel användarnamn eller lösenord.";
      }
    });
    document.getElementById("backFromOnline").addEventListener("click", goHome);
    document.getElementById("tabPublic").addEventListener("click", function () { onlineTab = "public"; renderOnline(); });
    document.getElementById("tabPrivate").addEventListener("click", function () { onlineTab = "private"; renderOnline(); });
    document.getElementById("saveBtn").addEventListener("click", function () {
      if (!currentUser()) {
        setAuthMode("login");
        document.getElementById("loginModal").classList.add("open");
        document.getElementById("loginErr").textContent = "Logga in eller skapa konto för att spara.";
        return;
      }
      document.getElementById("saveName").value = "";
      document.getElementById("saveErr").textContent = "";
      document.getElementById("saveModal").classList.add("open");
    });
    document.getElementById("saveCancel").addEventListener("click", function () { document.getElementById("saveModal").classList.remove("open"); });
    document.getElementById("pubCancel").addEventListener("click", function () { document.getElementById("pubModal").classList.remove("open"); });
    document.getElementById("saveConfirm").addEventListener("click", function () {
      const name = document.getElementById("saveName").value.trim();
      if (!name) { document.getElementById("saveErr").textContent = "Skriv ett namn."; return; }
      const items = getUserLists();
      items.unshift({ id: Date.now().toString(36), name: name, subtitle: "", author: currentUser(), words: words.slice() });
      setUserLists(items);
      document.getElementById("saveModal").classList.remove("open");
      document.getElementById("saveBtn").textContent = "Sparad";
    });
    document.getElementById("pubConfirm").addEventListener("click", function () {
      if (!publishTarget) return;
      const name = document.getElementById("pubName").value.trim();
      const subtitle = document.getElementById("pubSub").value.trim();
      const author = document.getElementById("pubAuthor").value.trim();
      if (!name || !author) { document.getElementById("pubErr").textContent = "Namn och publicerare behövs."; return; }
      const payload = { id: publishTarget.id || Date.now().toString(36), name: name, subtitle: subtitle, author: author, words: publishTarget.words || [] };
      if (hasSwears(payload)) { document.getElementById("pubErr").textContent = "Går inte att publicera. Olämpliga ord finns kvar."; return; }
      const pub = loadStore("dompic-public-v1");
      pub.unshift(payload);
      saveStore("dompic-public-v1", pub);
      document.getElementById("pubModal").classList.remove("open");
      onlineTab = "public";
      const blob = JSON.stringify(payload, null, 2);
      if (!GITHUB_REPO) {
        showScreen("onlineScreen", "Online", "Sätt GITHUB_REPO i index.html först, annars syns listan bara på den här datorn.");
        renderOnline();
        return;
      }
      const title = encodeURIComponent("[DompicGlosor] " + name);
      const body = encodeURIComponent("Publicerad via DompicGlosor.\n\n```json\n" + blob + "\n```");
      window.open("https://github.com/" + GITHUB_REPO + "/issues/new?title=" + title + "&body=" + body, "_blank");
      showScreen("onlineScreen", "Online", "Sista steget: tryck Submit på GitHub. Sen syns listan under Public för alla.");
      renderOnline();
    });
    document.addEventListener("click", function () {
      document.querySelectorAll(".menu.open").forEach(function (m) { m.classList.remove("open"); });
    });

  </script>
</body>
